name: Deploy to Dev VPS

on:
  push:
    branches:
      - dev
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_DEV }}
          username: ${{ secrets.VPS_USER_DEV }}
          password: ${{ secrets.VPS_PASSWORD_DEV }}
          script: |
            set -e

            cd /opt/internet-billing-systemf/

            echo "Pulling latest code..."
            git fetch origin
            git reset --hard origin/dev

            echo "Current commit:"
            git rev-parse HEAD

            echo "==> Writing .env from GitHub Secrets..."
            cat > .env << 'EOF'
            BASE_API_URL=${{ secrets.BASE_API_URL_DEV }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_DEV }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET_DEV }}
            AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET_DEV }}
            EOF

            echo "Stopping existing containers..."
            docker compose down --remove-orphans

            echo "Building fresh images..."
            docker compose build --pull --no-cache --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_DEV }}

            echo "Starting containers..."
            docker compose up -d --force-recreate

            echo "Cleaning up unused Docker resources..."
            docker image prune -af