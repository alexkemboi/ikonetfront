name: Deploy Production Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Deploy to Production VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USER_PROD }}
          password: ${{ secrets.VPS_PASSWORD_PROD }}
          command_timeout: 30m
          script: |
            set -e

            cd ~/internet-billing-systemf/

            echo "==> Fetching latest production code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Generating production .env from GitHub Secrets..."
            cat << 'EOF' > .env
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL_PROD }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_BASE_API_URL_PROD }}
            BASE_API_URL=${{ secrets.BASE_API_URL_PROD }}
            AUTH_TRUST_HOST=true
            NEXTAUTH_SECRET=${{ secrets.AUTH_SECRET_PROD }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET_PROD }}
            AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET_PROD }}
            EOF

            echo "==> Stopping active production containers..."
            docker compose down --remove-orphans

            echo "==> Building fresh Next.js Docker image..."
            docker compose build --pull --no-cache \
              --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_BASE_API_URL_PROD }} \
              --build-arg BASE_API_URL=${{ secrets.BASE_API_URL_PROD }}

            echo "==> Starting production containers..."
            docker compose up -d --force-recreate

            echo "==> Pruning dangling Docker image caches..."
            docker image prune -af

            echo "==> Deployment Complete!"