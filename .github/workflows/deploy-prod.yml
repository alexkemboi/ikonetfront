name: Deploy Production Frontend

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build happens on the GitHub runner, not on the VPS.
      # Cached layers persist across runs via GHA cache, so this
      # is fast even though it's a from-scratch multi-stage build.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: DockerFile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_BASE_API_URL_PROD }}
            BASE_API_URL=${{ secrets.BASE_API_URL_PROD }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to Production VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST_PROD }}
          username: ${{ secrets.VPS_USER_PROD }}
          password: ${{ secrets.VPS_PASSWORD_PROD }}
          command_timeout: 5m
          request_pty: true
          envs: IMAGE_TAG,REPO_NAME,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -euo pipefail
            cd ~/internet-billing-systemf/
            bash deploy.sh "${{ github.sha }}"
        env:
          IMAGE_TAG: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}