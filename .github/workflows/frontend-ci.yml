name: Frontend CI — Contract Quality Gate

on:
  pull_request:
    branches: [main, dev, develop]
  push:
    branches: [main, dev, develop]

jobs:
  contract-quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Reject credential logging
        run: |
          if rg -n --glob '*.{ts,tsx,js,jsx}' 'console\.[[:alnum:]_]+\([^)]*(apiToken|Authorization)' actions app lib components; then
            echo "Do not log API tokens or Authorization headers."
            exit 1
          fi

      - name: Unit & behavioral tests (MSW against contract fixtures)
        run: pnpm test

      - name: Pact consumer specs + freshness gate (generated pacts/ must be committed)
        run: test -f pacts/IBS_Frontend_NextJS-IBS_Backend_SpringBoot.json && pnpm test:pact:verify-fresh

      # The backend consumes the committed `pacts/` folder via
      # `@PactFolder` provider verification (PactProviderVerificationTest).
      # Required status check in branch protection; deploy workflows gate on
      # the same checks implicitly via success of this job.