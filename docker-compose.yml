services:
  beesnet-app:
    image: ghcr.io/alexkemboi/ikonetfront:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3456}:3456"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3456
      - BASE_API_URL=${BASE_API_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_URL=${AUTH_URL}
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
