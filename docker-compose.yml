services:
  beesnet-app:
    build:
      context: .
      dockerfile: DockerFile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3456}:3456"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3456
      - BASE_API_URL=${BASE_API_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
    networks:
      - default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


networks:
  default:
    driver: bridge
