services:
  beesnet-app:
    build:
      context: .
      dockerfile: DockerFile
    restart: unless-stopped
    ports:
      - "3456:3456"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3456 
    networks: 
      - default          # <-
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  

networks:
  default:
    driver: bridge
